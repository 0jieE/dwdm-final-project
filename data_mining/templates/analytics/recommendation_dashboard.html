{% extends "base.html" %}

{% block title %}Business Recommendations{% endblock %}

{% block header %}Recommendation Engine{% endblock %}

{% block content %}

<div class="container-fluid py-3">

    <!-- KPI SECTION -->
    <div class="row g-3 mb-4">

        <div class="col-12 col-md-3">
            <div class="card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-box-seam fs-2 text-success"></i>
                <div>
                    <small class="text-muted">Product Ideas</small>
                    <h4 class="mb-0" id="productCount">0</h4>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-3">
            <div class="card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-people fs-2 text-success"></i>
                <div>
                    <small class="text-muted">Customer Actions</small>
                    <h4 class="mb-0" id="customerCount">0</h4>
                </div>
            </div>
        </div>

    </div>

    <!-- MAIN GRID -->
    <div class="row g-3">

        <!-- PRODUCT RECOMMENDATIONS -->
        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">

                <h5 class="mb-3">Product Recommendations</h5>

                <div id="productRecs"
                     class="d-flex flex-column gap-2"
                     style="max-height: 500px; overflow-y: auto;">
                </div>

            </div>
        </div>

        <!-- CUSTOMER STRATEGY -->
        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">

                <h5 class="mb-3">Customer Strategy</h5>

                <div class="table-responsive">
                    <table class="table table-hover table-sm w-100 datatable">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Segment</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

</div>

<!-- =========================
     STYLES (minimal + clean)
========================= -->
<style>
.rec-card {
    padding: 12px;
    border-radius: 12px;
    background: rgba(37, 103, 19, 0.08);
    border: 1px solid rgba(37, 103, 19, 0.15);
    transition: 0.2s;
}

.rec-card:hover {
    transform: translateY(-2px);
    background: rgba(37, 103, 19, 0.12);
}

.rec-title {
    font-weight: 600;
}

.rec-sub {
    font-size: 12px;
    color: #6b7280;
}

/* MOBILE FIX */
@media (max-width: 768px) {

    .rec-card {
        font-size: 13px;
    }

    h5 {
        font-size: 16px;
    }

    .card {
        padding: 12px !important;
    }

    table {
        font-size: 12px;
    }
}
</style>

<!-- =========================
     SCRIPT
========================= -->
<script>

let customerTable = null;

function initTable() {

    if ($.fn.DataTable.isDataTable(".datatable")) {
        $(".datatable").DataTable().destroy();
    }

    $(".datatable").DataTable({
        pageLength: 10,
        responsive: true,
        searching: true,
        ordering: true,
        lengthChange: false
    });
}

fetch("/api/recommendations/")
.then(res => res.json())
.then(data => {

    const productContainer = document.getElementById("productRecs");
    const customerBody = document.getElementById("customerTableBody");

    let productCount = 0;
    let customerCount = 0;

    // =====================
    // PRODUCT RECOMMENDATIONS
    // =====================
    data.product_recommendations.forEach(item => {

        productCount++;

        productContainer.innerHTML += `
            <div class="rec-card">
                <div class="rec-title">${item.type}</div>
                <div>${item.message}</div>
                <div class="rec-sub">${item.reason}</div>
            </div>
        `;
    });

    // =====================
    // CUSTOMER STRATEGY
    // =====================
    data.customer_recommendations.forEach(item => {

        customerCount++;

        customerBody.innerHTML += `
            <tr>
                <td>${item.customer_id}</td>
                <td>${item.segment}</td>
                <td>
                    <span class="badge bg-success">
                        ${item.recommendation}
                    </span>
                </td>
            </tr>
        `;
    });

    // KPIs
    document.getElementById("productCount").innerText = productCount;
    document.getElementById("customerCount").innerText = customerCount;

    // INIT DATATABLE (IMPORTANT)
    initTable();

});

</script>

{% endblock %}
