{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-3">

    <!-- HEADER -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-2">
        <h3 class="mb-0">Dataset Explorer (RetailDW)</h3>

        <button class="btn btn-sm btn-outline-success" onclick="loadData()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>

    <!-- KPI CARDS -->
    <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
            <div class="card p-3 text-center">
                <small class="text-muted">Total Records</small>
                <h4 id="totalCount">--</h4>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card p-3 text-center">
                <small class="text-muted">Products</small>
                <h4 id="productCount">--</h4>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card p-3 text-center">
                <small class="text-muted">Stores</small>
                <h4 id="storeCount">--</h4>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card p-3 text-center">
                <small class="text-muted">Customers</small>
                <h4 id="customerCount">--</h4>
            </div>
        </div>

    </div>

    <!-- TABLE -->
    <div class="card p-3">

        <h5 class="mb-3">OrderItem Dataset</h5>

        <div class="table-responsive">
            <table class="table table-striped table-hover datatable" id="datasetTable">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Gender</th>
                        <th>Store</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Department</th>
                        <th>Brand</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

</div>

<script>
let products = new Set();
let customers = new Set();
let stores = new Set();

let dataTableInstance = null;

function loadData() {

    fetch("/api/dataset/")
        .then(res => res.json())
        .then(data => {

            const tbody = document.querySelector("#datasetTable tbody");
            tbody.innerHTML = "";

            products.clear();
            customers.clear();
            stores.clear();

            data.dataset.forEach(row => {

                products.add(row.product);
                customers.add(row.customer_id);
                stores.add(row.store);

                tbody.innerHTML += `
                    <tr>
                        <td>${row.order_id}</td>
                        <td>${row.date}</td>
                        <td>${row.customer_id}</td>
                        <td>${row.gender}</td>
                        <td>${row.store}</td>
                        <td>${row.product}</td>
                        <td>${row.category}</td>
                        <td>${row.department}</td>
                        <td>${row.brand}</td>
                        <td>${row.quantity}</td>
                        <td>${row.total_amount}</td>
                    </tr>
                `;
            });

            // KPIs
            document.getElementById("totalCount").innerText = data.count;
            document.getElementById("productCount").innerText = products.size;
            document.getElementById("storeCount").innerText = stores.size;
            document.getElementById("customerCount").innerText = customers.size;

            // IMPORTANT: re-init DataTable safely
            if (dataTableInstance) {
                dataTableInstance.destroy();
            }

            dataTableInstance = $('#datasetTable').DataTable({
                pageLength: 10,
                responsive: true,
                order: [[1, "desc"]]
            });

        });
}

loadData();
</script>

{% endblock %}
